name: C++ Build and Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure TTL8
        run: cmake -S . -B build-ttl8 -DCMAKE_BUILD_TYPE=Release

      - name: Build TTL8
        run: cmake --build build-ttl8 --config Release --parallel

      - name: Configure TTL4
        run: cmake -S ttl4 -B build-ttl4 -DCMAKE_BUILD_TYPE=Release

      - name: Build TTL4
        run: cmake -S ttl4 -B build-ttl4 -DCMAKE_BUILD_TYPE=Release

      - name: Build TTL4
        run: cmake --build build-ttl4 --config Release --parallel

      - name: Verify sample programs (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ./build-ttl8/ttl8-as programs/compare_add.asm build-ttl8/compare_add
          ./build-ttl8/ttl8-run build-ttl8/compare_add.bin > build-ttl8/output.txt
          ./build-ttl4/ttl4-as ttl4/programs/compare_add.asm build-ttl4/compare_add
          ./build-ttl4/ttl4-run build-ttl4/compare_add.bin > build-ttl4/output.txt
          grep -Eiq '^08$|^8$' build-ttl8/output.txt
          grep -Eiq '^8$|^08$' build-ttl4/output.txt
          echo "TTL8 output:" && cat build-ttl8/output.txt
          echo "TTL4 output:" && cat build-ttl4/output.txt

      - name: Verify sample programs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ttl8Asm = Get-ChildItem build-ttl8 -Filter ttl8-as.exe -Recurse | Select-Object -First 1
          $ttl8Run = Get-ChildItem build-ttl8 -Filter ttl8-run.exe -Recurse | Select-Object -First 1
          $ttl4Asm = Get-ChildItem build-ttl4 -Filter ttl4-as.exe -Recurse | Select-Object -First 1
          $ttl4Run = Get-ChildItem build-ttl4 -Filter ttl4-run.exe -Recurse | Select-Object -First 1
          if (-not $ttl8Asm -or -not $ttl8Run -or -not $ttl4Asm -or -not $ttl4Run) {
            throw 'Expected assembler/emulator executable was not produced.'
          }
          & $ttl8Asm.FullName 'programs/compare_add.asm' 'build-ttl8/compare_add'
          if ($LASTEXITCODE -ne 0) { throw 'TTL8 assembly failed.' }
          & $ttl4Asm.FullName 'ttl4/programs/compare_add.asm' 'build-ttl4/compare_add'
          if ($LASTEXITCODE -ne 0) { throw 'TTL4 assembly failed.' }
          $out8 = @(& $ttl8Run.FullName 'build-ttl8/compare_add.bin')
          if ($LASTEXITCODE -ne 0) { throw 'TTL8 execution failed.' }
          $out4 = @(& $ttl4Run.FullName 'build-ttl4/compare_add.bin')
          if ($LASTEXITCODE -ne 0) { throw 'TTL4 execution failed.' }
          if (($out8 -join '').Trim() -notin @('08', '8')) { throw "Unexpected TTL8 result: $out8" }
          if (($out4 -join '').Trim() -notin @('8', '08')) { throw "Unexpected TTL4 result: $out4" }
          Write-Host "TTL8 output: $out8"
          Write-Host "TTL4 output: $out4"
